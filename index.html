<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101514" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Дебют" />
    <link rel="manifest" href="./manifest.webmanifest?v=29" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon-v4.png" />
    <title>Дебют — шаховий тренер</title>
    <style>
      #boot-splash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; background: #101514; }
      #boot-splash img { display: block; width: 96px; height: 96px; border-radius: 24px; }
      #boot-splash span { width: 28px; height: 28px; border: 3px solid #d9bd7333; border-top-color: #d9bd73; border-radius: 50%; animation: boot-spin 900ms linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #boot-splash span { animation: none; } }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true"><img src="./icon-512-v4.png" width="96" height="96" alt="" /><span></span></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
